<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV World - أفضل خدمات البث المباشر</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container">
            <h1><i class="fas fa-tv"></i> IPTV World</h1>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <section class="apps-section">
            <div class="container">
                <h2>تطبيقاتنا المتاحة</h2>
                
                <!-- Loading Message -->
                <div id="loading-msg" class="loading" style="display: none;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p>جاري تحميل التطبيقات...</p>
                </div>
                
                <!-- Error Message -->
                <div id="error-msg" class="error" style="display: none;">
                    <i class="fas fa-exclamation-triangle fa-2x"></i>
                    <p>حدث خطأ أثناء تحميل التطبيقات. يرجى تحديث الصفحة.</p>
                </div>
                
                <!-- Apps Container -->
                <div id="apps-container" class="apps-grid">
                    <!-- التطبيقات هتظهر هنا أوتوماتيك -->
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 IPTV World. جميع الحقوق محفوظة</p>
            <p style="margin-top: 10px; font-size: 0.9rem;">
                <i class="fas fa-heart" style="color: var(--error);"></i> 
                مصنوع بجهد وحب
            </p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="assets/js/main.js"></script>
</body>
</html>
