<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV World - تفعيل التطبيقات والشاشات الذكية</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="logo">IPTV World</div>
        <button class="menu-btn"><i class="fas fa-bars"></i></button>
    </header>

    <!-- Hero -->
    <section class="hero">
        <h1>عالم IPTV بين يديك</h1>
        <p>فعّل جميع تطبيقات الشاشات الذكية واشترك في أفضل خدمات IPTV بسعر موحد</p>
    </section>

    <!-- Smart TV Section -->
    <section class="section container">
        <div class="card">
            <h2><i class="fas fa-tv"></i> تفعيل الشاشات الذكية</h2>
            <p style="text-align: center; color: #777; margin-bottom: 20px;">
                سامسونج، إل جي، أندرويد تي في، فاير ستيك، والمزيد
            </p>
            <div id="smart-tv-apps" class="apps-grid">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- IPTV Apps Section -->
    <section class="section container">
        <div class="card">
            <h2><i class="fas fa-mobile-alt"></i> تطبيقات IPTV</h2>
            <p style="text-align: center; color: #777; margin-bottom: 20px;">
                تطبيقات الأندرويد والهواتف المحمولة
            </p>
            <div id="iptv-apps" class="apps-grid">
                <div class="spinner"></div>
            </div>
        </div>
    </section>

    <!-- Floating Widget -->
    <div class="floating-widget">
        <div class="widget-options" id="widget-options">
            <a href="#" target="_blank" class="float-btn telegram" id="tg-link">
                <i class="fab fa-telegram-plane"></i>
            </a>
            <a href="#" target="_blank" class="float-btn whatsapp" id="wa-link">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
        <button class="widget-toggle" onclick="toggleWidget()">
            <i class="fas fa-headset"></i>
        </button>
    </div>

    <!-- Footer -->
    <footer>
        <p>© 2026 IPTV World. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module" src="assets/js/config.js"></script>
    <script type="module" src="assets/js/supabase-client.js"></script>
    <script type="module" src="assets/js/app.js"></script>
    <script>
        function toggleWidget() {
            document.getElementById('widget-options').classList.toggle('show');
        }
    </script>
</body>
</html>
