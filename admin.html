<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - IPTV World</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .admin-panel {
            display: none;
        }
        
        .form-section {
            background: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        
        .form-section h3 {
            color: var(--primary);
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-family: var(--font);
        }
        
        .save-btn {
            background: var(--success);
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            margin-top: 20px;
        }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .orders-table th,
        .orders-table td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }
        
        .orders-table th {
            background: var(--primary);
            color: white;
        }
        
        .orders-table tr:hover {
            background: #f5f5f5;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;        }
        
        .status-completed {
            background: #d4edda;
            color: #155724;
        }
    </style>
    
    <!-- Vercel Web Analytics -->
    <script>
      window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>

    <!-- Header -->
    <header class="main-header">
        <div class="logo">لوحة التحكم</div>
        <button class="menu-btn" onclick="window.location.href='index.html'">
            <i class="fas fa-home"></i>
        </button>
    </header>

    <!-- Login Section -->
    <div class="admin-container" id="login-section">
        <div class="login-box">
            <h2 style="color: var(--primary); margin-bottom: 20px;">🔐 تسجيل الدخول</h2>
            <div class="form-group">
                <input type="password" id="admin-password" placeholder="أدخل كلمة المرور">
            </div>
            <button onclick="checkLogin()" class="btn btn-primary">دخول</button>
            <p style="margin-top: 15px; color: #777; font-size: 0.9rem;">
                كلمة المرور الافتراضية: admin123
            </p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-container admin-panel" id="admin-panel">
        
        <!-- Site Config Section -->
        <div class="form-section">
            <h3>⚙️ إعدادات الموقع</h3>
            
            <div class="form-group">
                <label>سعر التفعيل ($)</label>
                <input type="number" id="config-price" value="70">
            </div>
            
            <div class="form-group">
                <label>مدة الاشتراك</label>
                <input type="text" id="config-duration" value="12 شهر">
            </div>
            
            <div class="form-group">                <label>رابط واتساب</label>
                <input type="text" id="config-wa" value="https://wa.link/9r70xe">
            </div>
            
            <div class="form-group">
                <label>رابط تليجرام</label>
                <input type="text" id="config-tg" value="https://t.me/FLlXX">
            </div>
            
            <div class="form-group">
                <label>رقم الدعم</label>
                <input type="text" id="config-support" value="+201112246002">
            </div>

            <button onclick="saveConfig()" class="btn btn-primary save-btn">
                <i class="fas fa-save"></i> حفظ التغييرات
            </button>
        </div>

        <!-- Orders Section -->
        <div class="form-section">
            <h3>📋 الطلبات الأخيرة</h3>
            <button onclick="loadOrders()" class="btn btn-check" style="margin-bottom: 15px;">
                <i class="fas fa-refresh"></i> تحديث
            </button>
            
            <div id="orders-container">
                <p style="text-align: center; color: #777;">اضغط على "تحديث" لعرض الطلبات</p>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="module">
        import { getSiteConfig, updateConfig, getAllOrders } from './assets/js/supabase-client.js';
        
        window.checkLogin = checkLogin;
        window.saveConfig = saveConfig;
        window.loadOrders = loadOrders;
        
        const ADMIN_PASSWORD = 'admin123'; // في الواقع، استخدم Supabase Auth
        
        function checkLogin() {
            const password = document.getElementById('admin-password').value;
            if (password === ADMIN_PASSWORD) {
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('admin-panel').style.display = 'block';
                loadConfig();
            } else {                alert('كلمة المرور غير صحيحة');
            }
        }

        async function loadConfig() {
            const config = await getSiteConfig();
            if (config) {
                document.getElementById('config-price').value = config.price || '70';
                document.getElementById('config-duration').value = config.duration || '12 شهر';
                document.getElementById('config-wa').value = config.whatsapp_link || '';
                document.getElementById('config-tg').value = config.telegram_link || '';
                document.getElementById('config-support').value = config.support_number || '';
            }
        }

        async function saveConfig() {
            const updates = [
                updateConfig('price', document.getElementById('config-price').value),
                updateConfig('duration', document.getElementById('config-duration').value),
                updateConfig('whatsapp_link', document.getElementById('config-wa').value),
                updateConfig('telegram_link', document.getElementById('config-tg').value),
                updateConfig('support_number', document.getElementById('config-support').value)
            ];
            
            const results = await Promise.all(updates);
            
            if (results.every(r => r.success)) {
                alert('✅ تم حفظ التغييرات بنجاح!');
            } else {
                alert('❌ حدث خطأ أثناء الحفظ');
            }
        }

        async function loadOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '<div class="spinner"></div>';
            
            const orders = await getAllOrders();
            
            if (orders.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #777;">لا توجد طلبات حتى الآن</p>';
                return;
            }
            
            const table = `
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>التاريخ</th>
                            <th>الاسم</th>                            <th>الهاتف</th>
                            <th>التطبيق</th>
                            <th>النوع</th>
                            <th>الحالة</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${orders.map(order => `
                            <tr>
                                <td>${new Date(order.created_at).toLocaleDateString('ar-EG')}</td>
                                <td>${order.customer_name}</td>
                                <td>${order.customer_phone}</td>
                                <td>${order.app_name}</td>
                                <td>${order.order_type === 'smart-tv' ? 'شاشة ذكية' : 'تطبيق'}</td>
                                <td><span class="status-badge status-${order.status}">${order.status}</span></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            
            container.innerHTML = table;
        }
    </script>
    
    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
