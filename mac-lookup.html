<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="mac.title">MAC Address Lookup - IPTV World</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="logo">
                <a href="index.html" style="text-decoration: none; color: inherit;">
                    <i class="fas fa-tv"></i>
                    <span>IPTV World</span>
                </a>
            </div>
            <nav class="main-nav">
                <ul>
                    <li><a href="index.html" data-i18n="nav.home">الرئيسية</a></li>
                    <li><a href="mac-lookup.html" class="active" data-i18n="nav.mac">فحص الجهاز</a></li>
                </ul>
            </nav>
            <button class="lang-switcher-btn" onclick="toggleLanguage()">
                <i class="fas fa-globe"></i>
                <span id="langText">EN</span>
            </button>
        </div>
    </header>

    <div class="lookup-container">
        <div class="lookup-header">
            <i class="fas fa-search"></i>
            <h1 data-i18n="mac.title">الكشف عن الشركة المصنعة</h1>
            <p data-i18n="mac.subtitle">أدخل MAC Address للتعرف على الشركة المصنعة للجهاز</p>
        </div>
        
        <div class="lookup-box">
            <input type="text" id="macInput" data-i18n-placeholder="mac.placeholder" placeholder="مثال: 00:1A:2B:3C:4D:5E">
            <button onclick="lookupMAC()" class="btn btn-primary" data-i18n="mac.search">
                <i class="fas fa-search"></i> بحث
            </button>
        </div>

        <div id="result" class="result-box"></div>

        <div class="examples">
            <h3 data-i18n="mac.examples">أمثلة شائعة:</h3>
            <div class="examples-grid">
                <code onclick="setMAC('00:1A:2B:3C:4D:5E')">00:1A:2B - Apple</code>
                <code onclick="setMAC('B8:27:EB:12:34:56')">B8:27:EB - Raspberry Pi</code>
                <code onclick="setMAC('00:50:56:AB:CD:EF')">00:50:56 - VMware</code>
            </div>
        </div>
    </div>

    <script src="assets/js/i18n.js"></script>
    <script src="assets/js/mac-lookup.js"></script>
</body>
</html>
