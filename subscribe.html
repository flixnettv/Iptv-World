<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Subscribe to IPTV World - Premium IPTV Service">
    <title>Subscribe - IPTV World</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #e91e63;
            --primary-dark: #c2185b;
            --dark: #1a1a2e;
            --light: #ffffff;
            --text: #1f2937;
            --text-muted: #6b7280;
            --success: #10b981;
            --radius-lg: 18px;
            --radius-xl: 35px;
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.1);
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9ecef 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: var(--text);
        }
        
        .subscribe-container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }
        
        /* Promotional Banner */
        .v16-promo-banner {
            background: linear-gradient(135deg, #fff5f7 0%, #ffeef2 100%);
            border: 2px solid var(--primary);
            border-radius: var(--radius-xl);
            overflow: hidden;            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.15);
            margin-bottom: 30px;
        }
        
        .v16-promo-header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .v16-promo-header i {
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        
        .v16-promo-content {
            padding: 30px;
        }
        
        .v16-promo-content h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
        }
        
        .v16-price-tag {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .old-price {
            font-size: 1.5rem;
            color: #999;            text-decoration: line-through;
            font-weight: 600;
        }
        
        .current-price {
            font-size: 3rem;
            font-weight: 900;
            color: var(--success);
            background: linear-gradient(135deg, #10b981, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .v16-promo-features {
            list-style: none;
            padding: 0;
            margin: 0 25px 25px 0;
        }
        
        .v16-promo-features li {
            padding: 10px 0;
            color: var(--text);
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .v16-promo-features li i {
            color: var(--success);
            font-size: 1.1rem;
        }
        
        .v16-trust-badges {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding-top: 20px;
            border-top: 1px dashed #ddd;
        }
        
        .v16-trust-badges span {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 8px;
        }        
        .v16-trust-badges i {
            color: var(--primary);
        }
        
        /* App Info Card */
        .app-info-card {
            background: var(--light);
            border-radius: var(--radius-xl);
            padding: 30px;
            text-align: center;
            box-shadow: var(--shadow-xl);
            margin-bottom: 20px;
        }
        
        .app-info-card h2 {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 10px;
        }
        
        .app-info-card p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 25px;
        }
        
        /* Activate Button */
        .activate-btn {
            width: 100%;
            height: 65px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white !important;
            border: none;
            border-radius: var(--radius-lg);
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            box-shadow: 0 8px 25px rgba(233, 30, 99, 0.4);
        }
        
        .activate-btn:hover {
            transform: translateY(-3px);            box-shadow: 0 12px 35px rgba(233, 30, 99, 0.5);
        }
        
        .activate-btn:active {
            transform: translateY(0);
        }
        
        /* Responsive */
        @media (max-width: 480px) {
            .v16-promo-content { padding: 20px; }
            .v16-promo-content h2 { font-size: 1.2rem; }
            .current-price { font-size: 2.5rem; }
            .app-info-card { padding: 20px; }
            .app-info-card h2 { font-size: 1.4rem; }
            .activate-btn { font-size: 1rem; height: 60px; }
        }
    </style>
</head>
<body>

    <div class="subscribe-container">
        
        <!-- Promotional Banner -->
        <div class="v16-promo-banner">
            <div class="v16-promo-header">
                <i class="fas fa-gift"></i>
                <span>Special Offer</span>
            </div>
            <div class="v16-promo-content">
                <h2>Activation + Channel List 12 months</h2>
                <div class="v16-price-tag">
                    <span class="old-price">$100</span>
                    <span class="current-price">$70</span>
                </div>
                <ul class="v16-promo-features">
                    <li><i class="fas fa-check-circle"></i> 10,000+ Live Channels</li>
                    <li><i class="fas fa-check-circle"></i> FHD & 4K Quality</li>
                    <li><i class="fas fa-check-circle"></i> Movies & Series Library</li>
                    <li><i class="fas fa-check-circle"></i> 24/7 Premium Support</li>
                    <li><i class="fas fa-check-circle"></i> Instant Activation</li>
                </ul>
                <div class="v16-trust-badges">
                    <span><i class="fas fa-shield-alt"></i> Secure Payment</span>
                    <span><i class="fas fa-undo"></i> 7-Day Guarantee</span>
                </div>
            </div>
        </div>
        
        <!-- App Info Card with Activate Button -->
        <div class="app-info-card">            <h2 id="app-name">Loading...</h2>
            <p id="app-type">Loading application details...</p>
            
            <button id="activate-btn" class="activate-btn">
                <i class="fas fa-credit-card"></i>
                <span>Activate Now</span>
            </button>
        </div>

    </div>

    <script>
        // Get app info from URL
        const urlParams = new URLSearchParams(window.location.search);
        const appId = urlParams.get('app');
        
        console.log('🔍 App ID from URL:', appId);
        
        // App configurations - MUST MATCH EXACTLY WITH apps.json IDs
        const appConfig = {
            'iptv-smarters-pro': {
                name: 'IPTV Smarters Pro',
                type: 'IPTV App Activation',
                page: 'activate-app.html'
            },
            'mega-tv': {
                name: 'MEGA TV',
                type: 'IPTV App Activation',
                page: 'activate-app.html'
            },
            'aroma-iptv': {
                name: 'Aroma IPTV',
                type: 'IPTV App Activation',
                page: 'activate-app.html'
            },
            'smartone-iptv': {
                name: 'Smartone IPTV',
                type: 'IPTV App Activation',
                page: 'activate-app.html'
            },
            'flix-iptv': {
                name: 'Flix IPTV',
                type: 'Smart TV Activation',
                page: 'activate-smart-tv.html'
            },
            'elk-player': {
                name: 'ELK Player',
                type: 'Smart TV Activation',
                page: 'activate-smart-tv.html'
            },            'ibo-player': {
                name: 'Ibo Player',
                type: 'Smart TV Activation',
                page: 'activate-smart-tv.html'
            }
        };
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            const activateBtn = document.getElementById('activate-btn');
            const appNameEl = document.getElementById('app-name');
            const appTypeEl = document.getElementById('app-type');
            
            if (!appId) {
                console.error('❌ No app ID in URL');
                appNameEl.textContent = 'Error';
                appTypeEl.textContent = 'No application selected';
                activateBtn.disabled = true;
                activateBtn.style.opacity = '0.5';
                activateBtn.style.cursor = 'not-allowed';
                return;
            }
            
            const app = appConfig[appId];
            
            if (!app) {
                console.error('❌ App not found in config:', appId);
                appNameEl.textContent = 'Application Not Found';
                appTypeEl.textContent = `App ID: ${appId}`;
                activateBtn.disabled = true;
                activateBtn.style.opacity = '0.5';
                activateBtn.style.cursor = 'not-allowed';
                return;
            }
            
            console.log('✅ App found:', app);
            
            // Set app name and type
            appNameEl.textContent = app.name;
            appTypeEl.textContent = app.type;
            
            // Add click event to button
            activateBtn.addEventListener('click', function(e) {
                e.preventDefault();
                console.log('🚀 Redirecting to:', `${app.page}?app=${appId}`);
                
                // Redirect to activation form
                window.location.href = `${app.page}?app=${encodeURIComponent(appId)}`;
            });
                        console.log('✅ Button event listener attached');
        });
    </script>
</body>
</html>
